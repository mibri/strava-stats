# Unit tests for the dashboard's pure analytics (web/analytics.js). No npm install:
# Node's built-in test runner discovers tests/**/*.test.js.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
